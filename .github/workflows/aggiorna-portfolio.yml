name: Aggiorna portfolio da Google Drive

# Ogni giorno feriale l'attività "Post LinkedIn del giorno" salva i post in
# Google Drive (cartella "Portfolio sito", file posts_AAAA-MM-GG.json).
# Questo automatismo prende il file più recente, aggiorna il blocco dati
# di index.html e pubblica. Si può lanciare anche a mano da Actions → Run workflow.

on:
  schedule:
    - cron: '35 7 * * 1-5'    # 8:35 ora italiana (9:35 con l'ora legale)
    - cron: '35 10 * * 1-5'   # secondo passaggio di sicurezza
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: portfolio-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scarica i post da Drive e aggiorna index.html
        env:
          FOLDER_ID: 1_hq7nHl6IROqTsnKyLIxaEsFXlcqNQcf
        run: |
          python3 - <<'PY'
          import os, re, json, sys, urllib.request

          folder = os.environ["FOLDER_ID"]
          ua = {"User-Agent": "Mozilla/5.0 (portfolio-sync)"}

          def get(url):
              req = urllib.request.Request(url, headers=ua)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.read().decode("utf-8")

          # 1. elenco dei file della cartella pubblica
          listing = get(f"https://drive.google.com/embeddedfolderview?id={folder}")
          files = []
          for m in re.finditer(r'id="entry-([\w-]{20,})"', listing):
              chunk = listing[m.end():m.end() + 3000]
              t = re.search(r'class="flip-entry-title">\s*([^<]+?)\s*<', chunk)
              if t and re.fullmatch(r"posts_\d{4}-\d{2}-\d{2}\.json", t.group(1)):
                  files.append((t.group(1), m.group(1)))
          if not files:
              sys.exit("Nessun file posts_AAAA-MM-GG.json visibile: la cartella Drive "
                       "'Portfolio sito' è condivisa con 'chiunque abbia il link'?")
          name, file_id = sorted(files)[-1]
          print("File più recente su Drive:", name)

          # 2. scarica e controlla i post
          posts = json.loads(get(f"https://drive.google.com/uc?export=download&id={file_id}"))
          if not isinstance(posts, list) or not posts or not all(
                  isinstance(p, dict) and p.get("date") and p.get("post") for p in posts):
              sys.exit("Il file scaricato non ha la forma attesa: sito non modificato.")

          # 3. sostituisce solo il blocco dati di index.html
          src = open("index.html", encoding="utf-8").read()
          pat = re.compile(r'(<script type="application/json" id="posts">)(.*?)(</script>)', re.S)
          m = pat.search(src)
          if not m:
              sys.exit("Blocco <script id=\"posts\"> non trovato in index.html.")
          current = json.loads(m.group(2))
          if len(posts) < len(current):
              sys.exit(f"Il file su Drive ha {len(posts)} post, il sito {len(current)}: "
                       "per prudenza non tolgo post dal sito.")
          block = json.dumps(posts, ensure_ascii=False, indent=1).replace("</", "<\\/")
          new = src[:m.start(2)] + block + src[m.end(2):]
          json.loads(pat.search(new).group(2))
          if new == src:
              print("Nessuna novità da pubblicare.")
          else:
              open("index.html", "w", encoding="utf-8").write(new)
              print(f"index.html aggiornato: {len(posts)} post, ultimo del {posts[0]['date']}.")
          PY

      - name: Pubblica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Sante Maiolica"
          git config user.email "sante.maiolica@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "Niente da pubblicare"; exit 0; fi
          git commit -m "Post del $(date +%F): aggiornamento automatico da Drive"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null 2>&1 || true
